name: ytriple-source

x-source-service: &source-service
  build:
    context: .
    dockerfile: services/source-service/Dockerfile
  init: true
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ytriple_source
      POSTGRES_USER: ytriple_source
      POSTGRES_PASSWORD: ytriple_source_local
    ports:
      - "127.0.0.1:${SOURCE_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ytriple_source -d ytriple_source"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - source-postgres:/var/lib/postgresql/data

  source-api:
    <<: *source-service
    command: ["node", "services/source-service/dist/main.js", "api"]
    environment:
      SOURCE_DATABASE_URL: postgresql://ytriple_source:ytriple_source_local@postgres:5432/ytriple_source
      SOURCE_HOST: 0.0.0.0
      SOURCE_PORT: 47321
      SOURCE_BOOTSTRAP_TOKEN: ${SOURCE_BOOTSTRAP_TOKEN:-local-bootstrap-only}
      SOURCE_TOKEN_SECRET: ${SOURCE_TOKEN_SECRET:-local-device-token-secret-change-before-remote-use}
      SOURCE_CURSOR_SECRET: ${SOURCE_CURSOR_SECRET:-local-cursor-signing-secret-change-before-remote-use}
      SOURCE_PAIRING_ENABLED: ${SOURCE_PAIRING_ENABLED:-true}
      SOURCE_RECOMMENDED_DEFAULTS_ENABLED: ${SOURCE_RECOMMENDED_DEFAULTS_ENABLED:-true}
    ports:
      - "127.0.0.1:${SOURCE_PORT:-47321}:47321"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:47321/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 20

  source-worker:
    <<: *source-service
    command: ["node", "services/source-service/dist/main.js", "worker"]
    environment:
      SOURCE_DATABASE_URL: postgresql://ytriple_source:ytriple_source_local@postgres:5432/ytriple_source
      SOURCE_HOST: 127.0.0.1
      SOURCE_WORKER_POLL_MS: 250
      SOURCE_READING_API_KEY: ${SOURCE_READING_API_KEY:-${GEMINI_API_KEY:-${GOOGLE_API_KEY:-}}}
      SOURCE_READING_MODEL: ${SOURCE_READING_MODEL:-gemini-3.8-flash}
      # Explicitly scoped to this loopback-only development compose. OrbStack
      # maps arbitrary public HTTPS hosts through RFC 2544 benchmark addresses.
      # Production deployments must not set this mode.
      SOURCE_LOCAL_DEV_EGRESS_MODE: orbstack-loopback

volumes:
  source-postgres:
