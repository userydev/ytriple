services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ytriple_source_test
      POSTGRES_USER: ytriple_source_test
      POSTGRES_PASSWORD: ytriple_source_test
    ports:
      - "127.0.0.1:${SOURCE_TEST_POSTGRES_PORT}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ytriple_source_test -d ytriple_source_test",
        ]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
